[project]
name = "support_agent"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Navaneeth D", email = "navaneethd2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "google-genai>=2.22.0",
    "numpy>=2.5.3",
    "openai>=3.10.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "tabulate>=0.10.0",
    "tqdm>=4.70.0",
]

[project.scripts]
support_agent = "support_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
